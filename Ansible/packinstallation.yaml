- name : this playbook is for apache installation 
  hosts : all
  become : true 

  tasks :
    - name : update
      shell : 
        cmd : apt-get update

    - name: install httpd
      yum : 
        name : httpd
        state : latest
      ignore_errors : true

    - name : install apache
      apt : 
        name : apache2
        state : latest
- name : installing packages though ansible module
  hosts : all
  become : true
  tasks :
    - name  : install httpd
      package :
        name : httpd
        state : latest
      when: ansible_os_family == "RedHat"

    - name : install apache2
      package :
        name : apache2
        state : latest
      when: ansible_os_family == "Debian"
    - name : start apache2
      systemd :
        name : apache2
        state : started
        enabled : true